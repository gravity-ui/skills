<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таблица данных</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f4f5f7;
    color: #1a1a2e;
    padding: 40px 20px;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
  .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .selected-info { font-size: 13px; color: #555; }
  .selected-info strong { color: #1a73e8; }
  .rows-per-page { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555; }
  .rows-per-page select { padding: 4px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; background: #fff; cursor: pointer; }

  .table-wrap { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead { background: #fafafa; }
  th {
    text-align: left;
    padding: 12px 14px;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #555;
    border-bottom: 2px solid #eaeaea;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th:hover { color: #1a73e8; }
  th .sort-arrow { display: inline-block; margin-left: 4px; font-size: 11px; opacity: 0.35; }
  th.sorted-asc .sort-arrow, th.sorted-desc .sort-arrow { opacity: 1; color: #1a73e8; }

  td { padding: 10px 14px; border-bottom: 1px solid #f1f1f1; vertical-align: middle; }
  tbody tr { transition: background .15s; }
  tbody tr:hover { background: #f6f8ff; }
  tbody tr.selected { background: #e8f0fe; }
  tbody tr.selected:hover { background: #dce6fa; }

  td input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #1a73e8; }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-top: 1px solid #eaeaea;
    flex-wrap: wrap;
    gap: 10px;
  }
  .page-buttons { display: flex; gap: 4px; }
  .page-buttons button {
    padding: 6px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  .page-buttons button:hover:not(:disabled) { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  .page-buttons button:disabled { opacity: 0.4; cursor: default; }
  .page-buttons button.active { background: #1a73e8; color: #fff; border-color: #1a73e8; font-weight: 600; }
  .pagination-info { font-size: 13px; color: #666; }

  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
  .badge--active  { background: #d4edda; color: #155724; }
  .badge--inactive { background: #fce4d6; color: #7f2a0a; }
  .badge--pending { background: #fff3cd; color: #6c5000; }
</style>
</head>
<body>
<div class="container">
  <h1>Таблица данных</h1>
  <p class="subtitle">Сортировка по колонкам, пагинация, выделение строк чекбоксами</p>

  <div class="toolbar">
    <div class="selected-info" id="selected-count"><strong>0</strong> строк выбрано</div>
    <div class="rows-per-page">
      <label for="pageSize">Строк на странице:</label>
      <select id="pageSize">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="20">20</option>
        <option value="50">50</option>
      </select>
    </div>
  </div>

  <div class="table-wrap">
    <table id="dataTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<script>
const DATA = [
  { id: 1,  name: 'Иван Петров',         email: 'ivan@example.com',      role: 'Разработчик',  status: 'active',   created: '2024-01-15' },
  { id: 2,  name: 'Елена Сидорова',      email: 'elena@example.com',    role: 'Дизайнер',     status: 'active',   created: '2024-02-10' },
  { id: 3,  name: 'Алексей Кузнецов',    email: 'alex@example.com',     role: 'Менеджер',     status: 'inactive', created: '2023-11-05' },
  { id: 4,  name: 'Мария Морозова',      email: 'maria@example.com',    role: 'Разработчик',  status: 'active',   created: '2024-03-22' },
  { id: 5,  name: 'Дмитрий Волков',      email: 'dmitry@example.com',   role: 'Тестировщик',  status: 'pending',  created: '2024-04-01' },
  { id: 6,  name: 'Анастасия Попова',    email: 'nastya@example.com',   role: 'Дизайнер',     status: 'active',   created: '2024-05-18' },
  { id: 7,  name: 'Сергей Смирнов',      email: 'sergey@example.com',   role: 'DevOps',       status: 'inactive', created: '2023-12-11' },
  { id: 8,  name: 'Ольга Фёдорова',      email: 'olga@example.com',     role: 'Разработчик',  status: 'active',   created: '2024-06-30' },
  { id: 9,  name: 'Максим Орлов',        email: 'max@example.com',      role: 'Аналитик',     status: 'pending',  created: '2024-07-14' },
  { id: 10, name: 'Татьяна Зайцева',     email: 'tatyana@example.com',  role: 'Тестировщик',  status: 'active',   created: '2024-08-05' },
  { id: 11, name: 'Николай Васильев',    email: 'nikolay@example.com',  role: 'Разработчик',  status: 'inactive', created: '2024-09-01' },
  { id: 12, name: 'Юлия Борисова',       email: 'yuliya@example.com',   role: 'Дизайнер',     status: 'active',   created: '2024-10-10' },
  { id: 13, name: 'Виктор Григорьев',    email: 'viktor@example.com',   role: 'Менеджер',     status: 'pending',  created: '2024-11-20' },
  { id: 14, name: 'Дарья Белова',        email: 'darya@example.com',    role: 'Разработчик',  status: 'active',   created: '2025-01-08' },
  { id: 15, name: 'Роман Ковалёв',       email: 'roman@example.com',    role: 'DevOps',       status: 'active',   created: '2025-02-14' },
  { id: 16, name: 'Светлана Жукова',     email: 'svetlana@example.com', role: 'Аналитик',     status: 'inactive', created: '2025-03-25' },
  { id: 17, name: 'Антон Тарасов',       email: 'anton@example.com',    role: 'Тестировщик',  status: 'active',   created: '2025-04-16' },
  { id: 18, name: 'Екатерина Новикова',  email: 'ekaterina@example.com', role: 'Дизайнер',    status: 'active',   created: '2025-05-09' },
  { id: 19, name: 'Павел Алексеев',      email: 'pavel@example.com',     role: 'Разработчик', status: 'pending',  created: '2025-06-22' },
  { id: 20, name: 'Ирина Соколова',      email: 'irina@example.com',    role: 'Менеджер',     status: 'active',   created: '2025-07-30' },
  { id: 21, name: 'Георгий Медведев',    email: 'georgy@example.com',   role: 'DevOps',       status: 'inactive', created: '2025-08-13' },
  { id: 22, name: 'Вера Голубева',       email: 'vera@example.com',     role: 'Тестировщик',  status: 'active',   created: '2025-09-01' },
  { id: 23, name: 'Кирилл Филиппов',     email: 'kirill@example.com',    role: 'Аналитик',    status: 'pending',  created: '2025-10-05' },
];

const COLUMNS = [
  { key: 'id',      label: 'ID',       sortable: true },
  { key: 'name',    label: 'Имя',       sortable: true },
  { key: 'email',   label: 'Email',     sortable: true },
  { key: 'role',    label: 'Роль',      sortable: true },
  { key: 'status',  label: 'Статус',    sortable: true },
  { key: 'created', label: 'Создан',    sortable: true },
];

let pageSize    = 10;
let currentPage = 1;
let sortKey     = 'id';
let sortDir     = 'asc';
let selectedIds = new Set();

const tableHead   = document.getElementById('tableHead');
const tableBody   = document.getElementById('tableBody');
const pagination  = document.getElementById('pagination');
const pageSizeSel = document.getElementById('pageSize');
const selInfo     = document.getElementById('selected-count');

function getSortedData() {
  const arr = [...DATA];
  arr.sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    if (va < vb) return sortDir === 'asc' ? -1 : 1;
    if (va > vb) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });
  return arr;
}

function getPageData() {
  const sorted = getSortedData();
  const start  = (currentPage - 1) * pageSize;
  return sorted.slice(start, start + pageSize);
}

function totalPages() {
  return Math.ceil(DATA.length / pageSize) || 1;
}

function badge(status) {
  const map = { active: 'badge--active', inactive: 'badge--inactive', pending: 'badge--pending' };
  const lbl = { active: 'Активен', inactive: 'Неактивен', pending: 'Ожидает' };
  return '<span class="badge ' + (map[status] || '') + '">' + (lbl[status] || status) + '</span>';
}

function renderHead() {
  let h = '<th style="width:40px"><input type="checkbox" id="selectAll" title="Выделить всё на странице"></th>';
  h += COLUMNS.map(function(c) {
    var arrow = sortKey === c.key ? (sortDir === 'asc' ? '\u25B2' : '\u25BC') : '';
    var cls   = sortKey === c.key ? (sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc') : '';
    var click = c.sortable ? ' onclick="changeSort(\'' + c.key + '\')"' : '';
    return '<th class="' + cls + '"' + click + '>' + c.label + '<span class="sort-arrow">' + arrow + '</span></th>';
  }).join('');
  tableHead.innerHTML = h;

  var sa = document.getElementById('selectAll');
  if (sa) sa.addEventListener('change', onSelectAll);
}

function renderBody() {
  var pageData = getPageData();
  tableBody.innerHTML = pageData.map(function(row) {
    var checked = selectedIds.has(row.id) ? 'checked' : '';
    var cls     = selectedIds.has(row.id) ? ' selected' : '';
    return '<tr class="' + cls + '" data-id="' + row.id + '">'
      + '<td><input type="checkbox" ' + checked + ' data-id="' + row.id + '" class="row-check"></td>'
      + '<td>' + row.id + '</td>'
      + '<td>' + row.name + '</td>'
      + '<td>' + row.email + '</td>'
      + '<td>' + row.role + '</td>'
      + '<td>' + badge(row.status) + '</td>'
      + '<td>' + row.created + '</td>'
      + '</tr>';
  }).join('');

  document.querySelectorAll('.row-check').forEach(function(cb) {
    cb.addEventListener('change', onRowCheck);
  });

  var sa = document.getElementById('selectAll');
  if (sa) {
    var pageIds = pageData.map(function(r) { return r.id; });
    sa.checked = pageIds.length > 0 && pageIds.every(function(id) { return selectedIds.has(id); });
  }
}

function renderPagination() {
  var tp = totalPages();
  if (tp <= 1) { pagination.innerHTML = ''; return; }

  var btns = '';
  btns += '<button ' + (currentPage === 1 ? 'disabled' : '') + ' onclick="goTo(' + (currentPage - 1) + ')">\u2190 \u041D\u0430\u0437\u0430\u0434</button>';

  var start = Math.max(1, currentPage - 2);
  var end   = Math.min(tp, start + 4);
  if (end - start < 4) start = Math.max(1, end - 4);

  if (start > 1) btns += '<button onclick="goTo(1)">1</button>';
  if (start > 2) btns += '<button disabled>\u2026</button>';

  for (var p = start; p <= end; p++) {
    btns += '<button class="' + (p === currentPage ? 'active' : '') + '" onclick="goTo(' + p + ')">' + p + '</button>';
  }

  if (end < tp - 1) btns += '<button disabled>\u2026</button>';
  if (end < tp)     btns += '<button onclick="goTo(' + tp + ')">' + tp + '</button>';

  btns += '<button ' + (currentPage === tp ? 'disabled' : '') + ' onclick="goTo(' + (currentPage + 1) + ')">\u0412\u043F\u0435\u0440\u0451\u0434 \u2192</button>';

  pagination.innerHTML =
    '<div class="pagination-info">' + ((currentPage - 1) * pageSize + 1) + '\u2013'
    + Math.min(currentPage * pageSize, DATA.length) + ' \u0438\u0437 ' + DATA.length + '</div>'
    + '<div class="page-buttons">' + btns + '</div>';
}

function updateSelectedCount() {
  selInfo.innerHTML = '<strong>' + selectedIds.size + '</strong> \u0441\u0442\u0440\u043E\u043A \u0432\u044B\u0431\u0440\u0430\u043D\u043E';
}

function refreshUI() {
  renderHead();
  renderBody();
  renderPagination();
  updateSelectedCount();
}

function changeSort(key) {
  if (sortKey === key) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortKey = key;
    sortDir = 'asc';
  }
  currentPage = 1;
  refreshUI();
}

function goTo(page) {
  var tp = totalPages();
  if (page < 1 || page > tp) return;
  currentPage = page;
  refreshUI();
}

function onSelectAll(e) {
  var pageIds = getPageData().map(function(r) { return r.id; });
  if (e.target.checked) {
    pageIds.forEach(function(id) { selectedIds.add(id); });
  } else {
    pageIds.forEach(function(id) { selectedIds.delete(id); });
  }
  refreshUI();
}

function onRowCheck(e) {
  var id = Number(e.target.dataset.id);
  if (e.target.checked) { selectedIds.add(id); }
  else                  { selectedIds.delete(id); }

  var pageIds = getPageData().map(function(r) { return r.id; });
  var sa = document.getElementById('selectAll');
  if (sa) sa.checked = pageIds.every(function(id) { return selectedIds.has(id); });

  updateSelectedCount();
  var tr = e.target.closest('tr');
  if (tr) tr.classList.toggle('selected', e.target.checked);

  console.log('\u0412\u044B\u0431\u0440\u0430\u043D\u043D\u044B\u0435 ID:', Array.from(selectedIds).sort(function(a,b){ return a-b; }));
}

pageSizeSel.addEventListener('change', function() {
  pageSize = Number(pageSizeSel.value);
  currentPage = 1;
  refreshUI();
});

refreshUI();
</script>
</body>
</html>
