<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VizWidget — Sales Chart + Timeseries Monitor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 32px 16px;
    gap: 24px;
  }
  h1 { font-size: 22px; font-weight: 600; color: #e6edf3; letter-spacing: -0.3px; }

  .controls {
    display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
  }
  .controls button {
    background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
    border-radius: 8px; padding: 10px 22px; font-size: 14px;
    font-weight: 500; cursor: pointer; transition: all 0.15s;
  }
  .controls button:hover   { background: #30363d; }
  .controls button.active  {
    background: #238636; border-color: #238636; color: #fff; font-weight: 600;
  }

  .chart-wrapper {
    width: min(960px, 100%); background: #161b22; border: 1px solid #30363d;
    border-radius: 12px; padding: 8px;
  }
  #viz-canvas { width: 100%; height: 420px; display: block; border-radius: 8px; }

  .info {
    font-size: 12px; color: #6e7681; max-width: min(960px, 100%);
    text-align: center; line-height: 1.6;
  }
</style>
</head>
<body>
<h1>VizWidget — унифицированный виджет визуализации</h1>

<div class="controls">
  <button id="btn-line"      class="active"  onclick="switchTo('line')">📈 Продажи (линейный)</button>
  <button id="btn-ts"                        onclick="switchTo('timeseries')">📊 Мониторинг (временной ряд)</button>
  <button id="btn-resize"                    onclick="VizWidget.resize('main')">↺ Resize</button>
</div>

<div class="chart-wrapper">
  <canvas id="viz-canvas"></canvas>
</div>

<div class="info">
  Оба движка (<code>lineChartEngine.js</code> / <code>timeseriesEngine.js</code>) загружаются лениво при первом переключении.<br>
  Единый API: <code>VizWidget.create</code>, <code>.setMode</code>, <code>.setData</code>, <code>.setTitle</code>, <code>.resize</code>.
</div>

<!-- API-ядро загружается сразу, движки — лениво через setMode -->
<script src="vizWidget.js"></script>
<script>
  // ── демо-данные ──────────────────────────────────
  const salesData = [
    { label: 'Янв', value: 120 }, { label: 'Фев', value: 190 },
    { label: 'Мар', value: 145 }, { label: 'Апр', value: 210 },
    { label: 'Май', value: 260 }, { label: 'Июн', value: 195 },
    { label: 'Июл', value: 310 }, { label: 'Авг', value: 285 },
    { label: 'Сен', value: 340 }, { label: 'Окт', value: 300 },
    { label: 'Ноя', value: 370 }, { label: 'Дек', value: 420 },
  ];

  const tsData = [
    { name: 'CPU %', points: Array.from({ length: 60 }, (_, i) =>
      ({ ts: `${String(i).padStart(2, '0')}:00`, value: 20 + Math.sin(i * 0.3) * 15 + Math.random() * 8 })) },
    { name: 'Mem GB', points: Array.from({ length: 60 }, (_, i) =>
      ({ ts: `${String(i).padStart(2, '0')}:00`, value: 6 + Math.cos(i * 0.4) * 2 + Math.random() * 1.5 })) },
    { name: 'Req/s', points: Array.from({ length: 60 }, (_, i) =>
      ({ ts: `${String(i).padStart(2, '0')}:00`, value: 150 + Math.sin(i * 0.5 + 1) * 60 + Math.random() * 30 })) },
  ];

  // ── инициализация ────────────────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    VizWidget.create('viz-canvas', {
      mode: 'line',
      data: salesData,
      title: 'Продажи 2025 (млн руб.)',
    });
  });

  window.addEventListener('resize', () => VizWidget.resize('main'));

  function switchTo(mode) {
    const isLine = mode === 'line';
    document.getElementById('btn-line').classList.toggle('active', isLine);
    document.getElementById('btn-ts').classList.toggle('active', !isLine);

    VizWidget.setMode('main', mode).then(() => {
      VizWidget.setData('main', isLine ? salesData : tsData);
      VizWidget.setTitle('main', isLine ? 'Продажи 2025 (млн руб.)' : 'Мониторинг сервера (CPU / Mem / Req/s)');
    });
  }
</script>
</body>
</html>
