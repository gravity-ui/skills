<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f3ec" />
    <meta
      name="description"
      content="Тихо — ваше место для вдохновения. Истории об образе жизни, культуре, дизайне и путешествиях."
    />
    <title>Тихо — время для себя</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        document.documentElement.dataset.theme = JSON.parse(
          localStorage.getItem("tiho-dark"),
        )
          ? "dark"
          : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
