<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f8f9fb" />
    <meta
      name="description"
      content="Орбита — личное пространство для проектов, заметок и спокойной продуктивности."
    />
    <title>Орбита — ваше пространство для идей</title>
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem("orbita-theme"));
        if (theme === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
